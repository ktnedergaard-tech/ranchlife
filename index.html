<style>

.chip{padding:5px 10px;border-radius:16px;background:#2e3726;font-size:13px}.acard .row{gap:4px}.acard .chip{padding:2px 7px;font-size:11px;border-radius:11px}.chip.on{background:var(--hay);color:#2a2010;font-weight:700}

input[type=text]{font:inherit;background:#1d241a;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:7px 10px;width:100%;max-width:260px}

function tourPoint(L,d){const T=L.tr||[];let acc=0;for(let i=1;i<T.length;i++){const s2=Math.hypot(T[i-1][0]-T[i][0],T[i-1][1]-T[i][1]);if(acc+s2>=d){const u=(d-acc)/s2;return{x:lerp(T[i-1][0],T[i][0],u),y:lerp(T[i-1][1],T[i][1],u)};}acc+=s2;}return T.length?{x:T[T.length-1][0],y:T[T.length-1][1]}:null;}
function tourTick(L,dt){const p=S.p;if(!L.tour)return;if(p.ride){const T=L.tr=L.tr||[];if(!T.length||Math.hypot(T[0][0]-p.x,T[0][1]-p.y)>4){if(T.length)L.tourDist=(L.tourDist||0)+Math.hypot(T[0][0]-p.x,T[0][1]-p.y);T.unshift([p.x,p.y]);if(T.length>500)T.pop();}}
 if(!L.tourMsg&&L.tourDist>1500){L.tourMsg=1;toast('Flot tur! Rid tilbage ind på banen for at afslutte turen.','ok');}
 if(L.tourDist>1500&&inR(p.x,p.y,lessonArena(L))){L.tour=0;L.done.tur=1;L.active=null;toast('✓ Turen er slut! Eleverne rider ind på sporet igen.','ok');}}

function wander(a,dt,area,sp){if(dist(a.x,a.y,a.tx,a.ty)<3){a.moving=false;a.wait-=dt;if(a.wait<=0){a.tx=rnd(area.x,area.x+area.w);a.ty=rnd(area.y,area.y+area.h);a.wait=rnd(2,9);}}
 else{const d=dist(a.x,a.y,a.tx,a.ty),st=Math.min(d,sp*dt);const dx=(a.tx-a.x)/d,dy=(a.ty-a.y)/d;a.rot=angLerp(a.rot||0,Math.atan2(dx,dy),Math.min(1,dt*5));a.x+=dx*st;a.y+=dy*st;if(Math.abs(dx)>.2)a.face=dx>0?1:-1;a.moving=true;a.phase+=dt*sp/(a.kind==='horse'?62:28);}}
function dogYard(a,dt,night){const D1=HL.d1,D2=HL.d2;
 if(a.route&&a.route.length){const q=a.route[0],d=dist(a.x,a.y,q.x,q.y);if(d<4){a.route.shift();a.tx=a.x;a.ty=a.y;a.wait=rnd(1,4);return true;}const st=Math.min(d,62*dt),dx=(q.x-a.x)/d,dy=(q.y-a.y)/d;a.x+=dx*st;a.y+=dy*st;a.rot=angLerp(a.rot||0,Math.atan2(dx,dy),Math.min(1,dt*6));a.moving=true;a.phase+=dt*62/28;return true;}
 a.out=!inR(a.x,a.y,HOUSE);a.outT=(a.outT??rnd(15,40))-dt;
 if(a.out&&night){a.route=[D2,D1,HL.night];return true;}
 if(night)return false;
 if(a.outT<=0){a.outT=rnd(40,100);a.route=a.out?[D2,D1,HL.inP()]:[HL.dIn,D1,D2,HL.outP()];return true;}
 wander(a,dt,a.out?HL.outA:HL.inA,45);if(!a.moving&&a.wait>5)a.pose='lie';return true;}
function updateAnimals(dt){const night=S&&(hourOf(S.t)>=22||hourOf(S.t)<6);
 S.animals.forEach(a=>{a.moving=false;a.pose='stand';if(a.kind==='horse')for(const k of ['buck','hop','toss'])if(a[k]>0)a[k]=Math.max(0,a[k]-dt);
  if(a.state==='ridden'||a.state==='away')return;
  if(a.kind==='horse'&&a.state==='led'&&persLed(a,dt))return;
  if(a.state==='led'||a.state==='leash'){const tp=trailPoint(a.kind==='horse'?64*KS:38*KS);if(tp){const d=dist(a.x,a.y,tp.x,tp.y);if(d>2){const sp=Math.min(d*6,300);const dx=(tp.x-a.x)/d,dy=(tp.y-a.y)/d;if(d>4)a.rot=angLerp(a.rot||0,Math.atan2(dx,dy),Math.min(1,dt*7));a.x+=dx*Math.min(d,sp*dt);a.y+=dy*Math.min(d,sp*dt);if(Math.abs(dx)>.25)a.face=dx>0?1:-1;a.moving=sp>12;a.spd=sp;a.phase+=dt*sp/(a.kind==='horse'?(sp>130?78:62):26);}}
   if(a.kind==='dog'&&a.moving&&!inR(a.x,a.y,HOUSE)){a.happy=clamp(a.happy+dt*.4,0,100);a.walkDist=(a.walkDist||0)+dt*a.spd;if(a.walkDist>2500&&!a.walked){a.walked=true;toast(a.name+' har fået sin gåtur i dag.','ok');}}return;}
  if(a.state==='tied'){a.x=TIES[a.tie].x;a.y=TIES[a.tie].y;a.face=1;return;}
  if(a.state==='part'||a.state==='npcride'){partRide(a,dt);return;}
  if(a.state==='box'){persBox(a,dt,BOXES[a.box]);return;}
  if(a.state==='paddock'){persPaddock(a,dt);return;}
  if(a.state==='cage'){wander(a,dt,R(CAGE.x+12,CAGE.y+24,86,92),28);a.z=a.moving?Math.abs(Math.sin(a.phase*Math.PI))*6:0;return;}
  if(a.state==='home'){if(a.kind==='dog'&&dogYard(a,dt,night))return;if(night){const bed=a.kind==='dog'?{x:726,y:770}:{x:660,y:700};if(a.kind==='cat'){bed.x=400+(a.id%2)*10;bed.y=760;}a.tx=bed.x+(a.id%3)*8;a.ty=bed.y;wander(a,dt,R(bed.x,bed.y,1,1),40);if(!a.moving)a.pose='lie';}
   else{wander(a,dt,R(380,440,380,330),a.kind==='dog'?45:35);if(!a.moving&&a.wait>5)a.pose='lie';}}});}
